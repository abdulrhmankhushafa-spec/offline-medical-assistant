name: offline_medical_assistant
description: Offline-first Arabic medical assistant with SQLite Hybrid RAG and local GGUF inference.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.2.0
  sqflite: 2.4.2
  path: 1.9.1
  path_provider: 2.1.5
  crypto: 3.0.6
  uuid: 4.5.1
  lib_llama_cpp: 0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
